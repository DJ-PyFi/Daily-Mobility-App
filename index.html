  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"eb7f7e14-a26e-4a0b-8d76-8b2d3a0140ef\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"377182db-81ac-4101-8698-e8c7156f066c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"eb7f7e14-a26e-4a0b-8d76-8b2d3a0140ef\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"377182db-81ac-4101-8698-e8c7156f066c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.4 sion', area:'Thoracic', equipment:'foam roller', duration:80, unilateral:false, cue:'Roller across the shoulder blades, hands behind the head, extend over the roller on an exhale.'},\n  {id:'t4', name:'Cat-Cow Rotation', area:'Thoracic', equipment:'none', duration:80, unilateral:true, cue:'From all fours, thread one arm under and rotate up toward the ceiling, following with your gaze. Switch sides halfway through.'},\n  {id:'t5', name:'Peanut Ball Extension', area:'Thoracic', equipment:'peanut ball', duration:80, unilateral:false, cue:'Peanut ball along the spine at bra-line, arms overhead, let gravity open the chest.'},\n  {id:'t6', name:'Quadruped Reach', area:'Thoracic', equipment:'none', duration:80, unilateral:true, cue:'All fours, sweep one arm forward and up in an arc, rotating through the upper back. Switch sides halfway through.'},\n  {id:'t7', name:'Yoga Wheel Extension', area:'Thoracic', equipment:'yoga wheel', duration:80, unilateral:false, cue:'Sit against the wheel at bra-line, walk it down as you extend back over it, arms overhead.'},\n];\nconst OTHER = [\n  {id:'o1', name:'90/90 Hip Switch', area:'Hips', equipment:'none', duration:75, unilateral:false, cue:'Seated, rotate both knees from one side to the other, keeping the spine tall.'},\n  {id:'o2', name:'Couch Stretch', area:'Hips', equipment:'none', duration:80, unilateral:true, cue:'Rear foot up behind you, front knee forward, squeeze the glute and sink the hip forward. Switch legs halfway through.'},\n  {id:'o3', name:'Frog Stretch', area:'Hips', equipment:'none', duration:75, unilateral:false, cue:'Knees wide, feet flexed, sink the hips back toward the heels.'},\n  {id:'o4', name:'Standing Forward Fold', area:'Hamstrings', equipment:'none', duration:75, unilateral:false, cue:'Soft knees, hinge from the hips, let the head hang heavy.'},\n  {id:'o5', name:'Band Hamstring Stretch', area:'Hamstrings', equipment:'band', duration:80, unilateral:true, cue:'Band around the foot, leg extended, draw the toes back and lengthen the back of the leg. Switch legs halfway through.'},\n  {id:'o6', name:'Band Pull-Apart', area:'Shoulders', equipment:'band', duration:70, unilateral:false, cue:'Arms extended, pull the band apart squeezing the shoulder blades together.'},\n  {id:'o7', name:'Lacrosse Ball Pec Release', area:'Shoulders', equipment:'lacrosse ball', duration:75, unilateral:true, cue:'Ball against the wall on the chest muscle, lean in until you find a tender spot, breathe. Switch sides halfway through.'},\n  {id:'o8', name:'Doorway Pec Stretch', area:'Shoulders', equipment:'none', duration:70, unilateral:true, cue:'Forearm on the frame, step through gently until you feel a stretch across the chest. Switch arms halfway through.'},\n  {id:'o9', name:'Lacrosse Ball Glute Release', area:'Glutes', equipment:'lacrosse ball', duration:80, unilateral:true, cue:'Seated on the ball, find a tender spot in the glute, breathe and let it soften. Switch sides halfway through.'},\n  {id:'o10', name:'Figure-4 Stretch', area:'Glutes', equipment:'none', duration:75, unilateral:true, cue:'Ankle crossed over the opposite knee, hinge forward keeping the spine long. Switch legs halfway through.'},\n  {id:'o11', name:'Foam Roller Calf Release', area:'Calves', equipment:'foam roller', duration:75, unilateral:true, cue:'Roller under the calf, roll slowly from ankle to knee, pausing on tight spots. Switch legs halfway through.'},\n  {id:'o12', name:'Ankle Circles', area:'Calves', equipment:'none', duration:60, unilateral:true, cue:'Lift one foot, circle the ankle slowly in both directions. Switch feet halfway through.'},\n  {id:'o13', name:'Neck Rotation', area:'Neck', equipment:'none', duration:65, unilateral:false, cue:'Slowly turn the head side to side, staying within a comfortable range.'},\n  {id:'o14', name:'Bird Dog', area:'Core', equipment:'none', duration:75, unilateral:true, cue:'All fours, extend opposite arm and leg, keep the hips level and the core braced. Switch sides halfway through.'},\n  {id:'o15', name:'Standing Side Bend', area:'Lats', equipment:'none', duration:65, unilateral:true, cue:'Reach one arm overhead and lean sideways, feeling the stretch along the ribs. Switch sides halfway through.'},\n  {id:'o16', name:'Band Overhead Lat Stretch', area:'Lats', equipment:'band', duration:65, unilateral:true, cue:'Band overhead, hands wide, gently lean to one side to lengthen the lat. Switch sides halfway through.'},\n  {id:'o17', name:'Foam Roller Quad Release', area:'Quads', equipment:'foam roller', duration:75, unilateral:true, cue:'Roller under the front of the thigh, forearms supporting your weight, roll slowly from hip to knee. Switch legs halfway through.'},\n  {id:'o18', name:'Foam Roller IT Band Release', area:'IT Band', equipment:'foam roller', duration:70, unilateral:true, cue:'Roller along the outside of the thigh, stacked or kickstand leg for support, roll slowly from hip to knee. Switch sides halfway through.'},\n  {id:'o19', name:'Foam Roller Upper Back Release', area:'Upper Back', equipment:'foam roller', duration:75, unilateral:false, cue:'Roller under the shoulder blades, knees bent, hug your arms across your chest and roll slowly from mid-back to shoulders.'},\n  {id:'o20', name:'Foam Roller Glute Release', area:'Glutes', equipment:'foam roller', duration:75, unilateral:true, cue:'Seated on the roller, ankle crossed over the opposite knee, roll slowly and pause on tight spots. Switch sides halfway through.'},\n  {id:'o21', name:'Lacrosse Ball Plantar Release', area:'Feet', equipment:'lacrosse ball', duration:60, unilateral:true, cue:'Stand with the ball under the arch of one foot, roll slowly from heel to toes with light pressure. Switch feet halfway through.'},\n];\nconst DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\nconst DAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];\nfunction pad(n){ return n<10 ? '0'+n : ''+n; }\nfunction dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }\nfunction dayNumber(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000); }\nfunction startOfWeek(d){ const nd=new Date(d); const day=nd.getDay(); const diff=(day===0?-6:1-day); nd.setDate(nd.getDate()+diff); nd.setHours(0,0,0,0); return nd; }\nfunction addDays(base, n){ const nd = new Date(base); nd.setDate(nd.getDate() + n); return nd; }\nfunction mod(n,m){ return ((n%m)+m)%m; }\nfunction routineForDate(d, sessionLength, selectedEquipment){\n  const pools = filteredPools(selectedEquipment);\n  const tCount = sessionLength === 'quick' ? 1 : sessionLength === 'extended' ? 3 : 2;\n  const oCount = sessionLength === 'quick' ? 3 : sessionLength === 'extended' ? 9 : 6;\n  const dn = dayNumber(d);\n  const tStart = mod(dn * 2, pools.t.length);\n  const tSel = []; for (let i = 0; i < tCount; i++) tSel.push(pools.t[(tStart + i) % pools.t.length]);\n  const oStart = mod(dn * 3, pools.o.length);\n  const oSel = []; for (let i = 0; i < oCount; i++) oSel.push(pools.o[(oStart + i) % pools.o.length]);\n  return buildRoutine(oSel, tSel);\n}\nconst ALL_EXERCISES = TSPINE.concat(OTHER);\nconst EQUIPMENT_LIST = ['foam roller', 'peanut ball', 'lacrosse ball', 'band', 'yoga wheel'];\nfunction totalDuration(routine){ return routine.reduce((s,e)=>s+e.duration,0); }\nfunction filteredPools(selectedEquipment){\n  const allowed = e => e.equipment === 'none' || selectedEquipment.includes(e.equipment);\n  return { t: TSPINE.filter(allowed), o: OTHER.filter(allowed) };\n}\nfunction buildRoutine(oSel, tSel){\n  const total = oSel.length + tSel.length;\n  const gap = total / (tSel.length + 1);\n  const tPositions = new Set(tSel.map((_, i) => Math.min(total - 1, Math.round(gap * (i + 1)) - 1)));\n  const result = []; let oi = 0, ti = 0;\n  for (let pos = 0; pos < total; pos++) {\n    if (tPositions.has(pos) && ti < tSel.length) result.push(tSel[ti++]);\n    else result.push(oSel[oi++] || tSel[ti++]);\n  }\n  return result;\n}\nfunction loadJSON(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }\nfunction saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }\n\nclass Component extends DCLogic {\n  state = {\n    tab: 'today',\n    playerOpen: false,\n    playerPhase: 'session',\n    currentIndex: 0,\n    secondsLeft: 0,\n    paused: false,\n    selectedOffset: 0,\n    sessionOffset: 0,\n    detailId: null,\n    completions: loadJSON('tenmin_completions', []),\n    totalSeconds: loadJSON('tenmin_totalSeconds', 0),\n    selectedEquipment: loadJSON('tenmin_equipment', EQUIPMENT_LIST.slice()),\n  };\n\n  _routine(date){\n    return routineForDate(date, this.props.sessionLength || 'standard', this.state.selectedEquipment);\n  }\n  toggleEquipment(item){\n    this.setState(s => {\n      const has = s.selectedEquipment.includes(item);\n      const next = has ? s.selectedEquipment.filter(x => x !== item) : [...s.selectedEquipment, item];\n      saveJSON('tenmin_equipment', next);\n      return { selectedEquipment: next };\n    });\n  }\n\n  componentDidMount(){\n    this._timer = setInterval(() => {\n      const guided = (this.props.playerStyle || 'guided') !== 'selfpaced';\n      if (this.state.playerOpen && this.state.playerPhase === 'session' && !this.state.paused && guided) this.tick();\n    }, 1000);\n  }\n  componentWillUnmount(){ clearInterval(this._timer); }\n\n  tick(){\n    this.setState(s => {\n      const routine = this._routine(addDays(new Date(), s.sessionOffset));\n      const left = s.secondsLeft - 1;\n      if (left > 0) return { secondsLeft: left };\n      return this._advance(s, routine);\n    });\n  }\n  _advance(s, routine){\n    if (s.currentIndex + 1 < routine.length) {\n      return { currentIndex: s.currentIndex + 1, secondsLeft: routine[s.currentIndex + 1].duration, paused: false };\n    }\n    this._completeSession(s, routine);\n    return { playerPhase: 'complete' };\n  }\n  _completeSession(s, routine){\n    const key = dateKey(addDays(new Date(), s.sessionOffset));\n    const completions = this.state.completions.includes(key) ? this.state.completions : [...this.state.completions, key];\n    const totalSeconds = this.state.totalSeconds + totalDuration(routine);\n    saveJSON('tenmin_completions', completions);\n    saveJSON('tenmin_totalSeconds', totalSeconds);\n    this.setState({ completions, totalSeconds });\n  }\n  openPlayer(){\n    const offset = this.state.selectedOffset;\n    const routine = this._routine(addDays(new Date(), offset));\n    this.setState({ playerOpen: true, playerPhase: 'session', currentIndex: 0, secondsLeft: routine[0].duration, paused: false, sessionOffset: offset });\n  }\n  closePlayer(){ this.setState({ playerOpen: false }); }\n  togglePause(){ this.setState(s => ({ paused: !s.paused })); }\n  prevExercise(){\n    this.setState(s => {\n      if (s.currentIndex <= 0) return null;\n      const routine = this._routine(addDays(new Date(), s.sessionOffset));\n      return { currentIndex: s.currentIndex - 1, secondsLeft: routine[s.currentIndex - 1].duration, paused: false };\n    });\n  }\n  nextExercise(){\n    this.setState(s => this._advance(s, this._routine(addDays(new Date(), s.sessionOffset))));\n  }\n  setTab(tab){ this.setState({ tab }); }\n  selectDay(offset){ this.setState({ selectedOffset: offset }); }\n  openDetail(id){ this.setState({ detailId: id }); }\n  closeDetail(){ this.setState({ detailId: null }); }\n\n  renderVals(){\n    const now = new Date();\n    const todayKey = dateKey(now);\n    const hour = now.getHours();\n    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';\n\n    const completionsSet = new Set(this.state.completions);\n    let streak = 0; const cursor = new Date(now);\n    if (!completionsSet.has(dateKey(cursor))) cursor.setDate(cursor.getDate() - 1);\n    while (completionsSet.has(dateKey(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }\n\n    const selectedOffset = this.state.selectedOffset;\n    const selDate = addDays(now, selectedOffset);\n    const selRoutine = this._routine(selDate);\n    const totalMin = Math.round(totalDuration(selRoutine) / 60);\n    const selIsToday = selectedOffset === 0;\n    const selIsDone = completionsSet.has(dateKey(selDate));\n    const selDayFull = DAY_FULL[(selDate.getDay() + 6) % 7];\n    const selHeading = selIsToday ? 'Today' : selDayFull;\n    const selKicker = selIsToday ? \"Today's routine\" : selDayFull + \"'s routine\";\n    const selTopLine = selIsToday ? greeting : selDayFull + ' · ' + (selDate.getMonth() + 1) + '/' + selDate.getDate();\n\n    const areaSet = [];\n    selRoutine.forEach(e => { if (!areaSet.includes(e.area)) areaSet.push(e.area); });\n    const areaChips = areaSet.map((a, i) => ({ id: 'a'+i, label: a }));\n\n    const sessionRows = selRoutine.map((e, i) => ({\n      id: e.id + '-' + i, num: i + 1, name: e.name, area: e.area,\n      equipment: e.equipment === 'none' ? '' : e.equipment,\n      hasEquipment: e.equipment !== 'none',\n      durationLabel: e.unilateral ? e.duration + 's · ' + Math.round(e.duration / 2) + 's/side' : e.duration + 's',\n      openDetail: () => this.openDetail(e.id),\n    }));\n\n    const monday = startOfWeek(now);\n    const progressWeek = DAY_NAMES.map((label, i) => {\n      const d = new Date(monday); d.setDate(monday.getDate() + i);\n      const key = dateKey(d);\n      return { label, isToday: key === todayKey, isDone: completionsSet.has(key) };\n    });\n    const weekDots = progressWeek.map(d => ({\n      label: d.label[0], isDone: d.isDone,\n      isTodayNotDone: d.isToday && !d.isDone,\n      isPlainNotDone: !d.isToday && !d.isDone,\n    }));\n\n    const dayStrip = [];\n    for (let off = -5; off <= 7; off++) {\n      const d = addDays(now, off);\n      const key = dateKey(d);\n      dayStrip.push({\n        offset: off, label: DAY_NAMES[(d.getDay() + 6) % 7], dateNum: d.getDate(),\n        isToday: off === 0, isNotToday: off !== 0,\n        isSelected: off === selectedOffset, isNotSelected: off !== selectedOffset,\n        isDone: completionsSet.has(key), isNotDone: !completionsSet.has(key),\n        select: () => this.selectDay(off),\n      });\n    }\n\n    const sessions = this.state.completions.length;\n    const totalMinutesAll = Math.round(this.state.totalSeconds / 60);\n\n    const playerOpen = this.state.playerOpen;\n    const playerPhase = this.state.playerPhase;\n    const sessionRoutine = this._routine(addDays(now, this.state.sessionOffset));\n    const idx = this.state.currentIndex;\n    const current = sessionRoutine[idx] || sessionRoutine[0];\n    const secondsLeft = this.state.secondsLeft;\n    const r = 80, circumference = Math.round(2 * Math.PI * r * 100) / 100;\n    const frac = current ? Math.max(0, Math.min(1, secondsLeft / current.duration)) : 0;\n    const ringOffset = Math.round(circumference * (1 - frac) * 100) / 100;\n    const progressDots = sessionRoutine.map((e, i) => ({ id: e.id + '-dot-' + i, isDone: i < idx, isActive: i === idx, isUpcoming: i > idx }));\n    const isLast = idx >= sessionRoutine.length - 1;\n    const canGoPrev = idx > 0;\n    const isGuided = (this.props.playerStyle || 'guided') !== 'selfpaced';\n\n    const detailOpen = !!this.state.detailId;\n    const detailExercise = ALL_EXERCISES.find(e => e.id === this.state.detailId) || ALL_EXERCISES[0];\n    const isUnilateral = !!(current && current.unilateral);\n    const halfPoint = current ? current.duration / 2 : 0;\n    const onSecondSide = isUnilateral && secondsLeft <= halfPoint;\n    const sideLabel = !isUnilateral ? '' : (onSecondSide ? 'Second side — switch now' : 'First side');\n\n    return {\n      detailOpen, closeDetail: () => this.closeDetail(), stopClickDetail: (e) => e.stopPropagation(),\n      detailName: detailExercise.name, detailArea: detailExercise.area,\n      detailEquipment: detailExercise.equipment !== 'none' ? detailExercise.equipment : '',\n      detailHasEquipment: detailExercise.equipment !== 'none',\n      detailCue: detailExercise.cue,\n      detailUnilateral: !!detailExercise.unilateral,\n      detailPerSideLabel: Math.round(detailExercise.duration / 2) + 's per side — switch halfway through',\n      detailVideoUrl: 'https://www.youtube.com/results?search_query=' + encodeURIComponent(detailExercise.name + ' stretch how to'),\n      isUnilateral, sideLabel,\n      isGuided, isSelfPaced: !isGuided,\n      greeting, totalMin, streakLabel: streak + (streak === 1 ? ' day' : ' days'), hasStreak: streak > 0,\n      selHeading, selKicker, selTopLine, selIsDone,\n      areaChips, sessionRows, totalCount: selRoutine.length,\n      tabIsToday: this.state.tab === 'today', tabIsNotToday: this.state.tab !== 'today',\n      tabIsEquipment: this.state.tab === 'equipment', tabIsNotEquipment: this.state.tab !== 'equipment',\n      tabIsProgress: this.state.tab === 'progress', tabIsNotProgress: this.state.tab !== 'progress',\n      setToday: () => this.setTab('today'), setEquipment: () => this.setTab('equipment'), setProgress: () => this.setTab('progress'),\n      equipmentList: EQUIPMENT_LIST.map(item => ({\n        item, label: item.charAt(0).toUpperCase() + item.slice(1),\n        checked: this.state.selectedEquipment.includes(item), notChecked: !this.state.selectedEquipment.includes(item),\n        count: ALL_EXERCISES.filter(e => e.equipment === item).length,\n        toggle: () => this.toggleEquipment(item),\n      })),\n      dayStrip, weekDots,\n      stripRef: (el) => {\n        if (el && !this._scrolledOnce) {\n          this._scrolledOnce = true;\n          const todayEl = el.querySelector('[data-day-offset=\"0\"]');\n          if (todayEl) el.scrollLeft = todayEl.offsetLeft - (el.clientWidth - todayEl.clientWidth) / 2;\n        }\n      },\n      sessions, totalMinutesAll,\n      playerOpen, notPlayerOpen: !playerOpen,\n      isSessionPhase: playerPhase === 'session', isCompletePhase: playerPhase === 'complete',\n      openPlayer: () => this.openPlayer(), closePlayer: () => this.closePlayer(),\n      indexLabel: (idx + 1) + ' / ' + sessionRoutine.length,\n      currentName: current ? current.name : '', currentArea: current ? current.area : '',\n      currentEquipment: current && current.equipment !== 'none' ? current.equipment : '',\n      hasCurrentEquipment: !!(current && current.equipment !== 'none'),\n      currentCue: current ? current.cue : '', secondsLabel: String(secondsLeft),\n      ringOffset, ringCircumference: circumference,\n      progressDots,\n      paused: this.state.paused, notPaused: !this.state.paused,\n      togglePause: () => this.togglePause(), prevExercise: () => this.prevExercise(), nextExercise: () => this.nextExercise(),\n      canGoPrev, cannotGoPrev: !canGoPrev, isLast,\n      finishTotalMin: Math.round(totalDuration(sessionRoutine) / 60),\n      doneClose: () => { this.closePlayer(); this.setTab('today'); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
