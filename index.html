<html lang="en">

<title>10 Minute Mobility</title>
<meta name="description" content="A daily mobility and stretching routine — thoracic spine reset plus full body, in about ten minutes.">

<meta name="apple-mobile-web-app-title" content="10 Min Mobility">

<style>
/* ═══════════════════════ Fonts — self-hosted, so the app works offline ═══════════════════════ */
@font-face {
  font-family: 'Caprasimo';
  font-style: normal; font-weight: 400; font-display: swap;
  src: url("fonts/caprasimo-latin-ext.woff2") format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Caprasimo';
  font-style: normal; font-weight: 400; font-display: swap;
  src: url("fonts/caprasimo-latin.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Figtree';
  font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("fonts/figtree-latin-ext.woff2") format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Figtree';
  font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("fonts/figtree-latin.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* ═══════════════════════ Design tokens — carried over from the design system ═══════════════════════ */
:root {
  color-scheme: light;
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100: #f9f4ed; --color-neutral-200: #eee7db; --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5; --color-neutral-500: #a19786; --color-neutral-600: #82796a;
  --color-neutral-700: #645c50; --color-neutral-800: #474238; --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb; --color-accent-200: #ffe1d0; --color-accent-300: #ffc6a5;
  --color-accent-400: #f6a06b; --color-accent-500: #d67f48; --color-accent-600: #b2622d;
  --color-accent-700: #8c491a; --color-accent-800: #643312; --color-accent-900: #402310;

  --color-accent-2-100: #f0fae1; --color-accent-2-200: #e1eecc; --color-accent-2-300: #ccdbb2;
  --color-accent-2-400: #aebf92; --color-accent-2-500: #8fa073; --color-accent-2-600: #728157;
  --color-accent-2-700: #56633f; --color-accent-2-800: #3d472b; --color-accent-2-900: #272e1b;

  --font-heading: "Caprasimo", system-ui, sans-serif;
  --font-heading-weight: 400;
  --font-body: "Figtree", system-ui, sans-serif;

  --space-1: 4.4px; --space-2: 8.8px; --space-3: 13.2px; --space-4: 17.6px; --space-6: 26.4px; --space-8: 35.2px;
  --radius-sm: 8px; --radius-md: 16px; --radius-lg: 28px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #e7e0d1; color: var(--color-text); font-family: var(--font-body);
  font-size: 15px; line-height: 1.55; font-weight: 400;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 32px; } h2 { font-size: 25px; } h3 { font-size: 20px; }
p { margin: 0 0 var(--space-3); }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none; touch-action: manipulation; -webkit-user-select: none; user-select: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: 999px;
}
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }

/* — cards / tags — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: calc(var(--radius-lg) * 1.15); background: var(--color-surface);
}
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px; border-radius: 999px;
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — segmented control (used for the two session settings) — */
.seg {
  display: flex; overflow: hidden; border: 1px solid var(--color-divider); border-radius: 999px;
}
.seg-opt {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 10px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt.is-checked { background: var(--color-accent-600); color: #fff; }

/* — dialog — */
.dialog-backdrop {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: var(--space-4); z-index: 96;
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: 100%; max-width: 440px; max-height: 82%; overflow: auto;
  display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: calc(var(--radius-lg) * 1.15);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 20px; }
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* ═══════════════════════ App shell — a real, resizable app instead of a fixed phone mockup ═══════════════════════ */
#app-shell { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
#app {
  width: 100%; max-width: 480px; height: 100dvh;
  background: var(--color-bg); display: flex; flex-direction: column;
  overflow: hidden; position: relative;
}
@media (min-width: 560px) {
  #app-shell { padding: 32px; }
  #app { height: min(844px, calc(100dvh - 64px)); border-radius: 40px; box-shadow: 0 30px 70px rgba(28,20,14,0.28); }
}
/* Installed as a standalone app: no card chrome, true full-bleed. */
@media (display-mode: standalone) {
  #app-shell { padding: 0; }
  #app { max-width: none; height: 100dvh; border-radius: 0; box-shadow: none; }
}

.topbar {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: calc(14px + env(safe-area-inset-top)) 16px 8px;
}
.icon-btn {
  background: var(--color-neutral-100); border: none; border-radius: 50%;
  width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; flex: none;
}
.tabbar {
  flex: none; display: flex; justify-content: space-around; align-items: center;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--color-divider); background: var(--color-bg);
}
.tab-btn {
  background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 16px; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none;
  font: 600 11px var(--font-body); color: var(--color-neutral-500);
}
.tab-btn.is-active { color: var(--color-accent-700); font-weight: 700; }

.day-tile {
  scroll-snap-align: center; flex: none; width: 54px; height: 74px; border-radius: var(--radius-md);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; border: none;
}
.day-strip { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 8px; scroll-snap-type: x proximity; }

.ring-arc { transition: stroke-dashoffset 0.92s linear; }
.session-row { cursor: pointer; touch-action: manipulation; }
.equipment-row { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>

<div id="app-shell"><div id="app"></div></div>

<script>
'use strict';

/* ═══════════════════════ Exercise data — unchanged from the design ═══════════════════════ */
const TSPINE = [
  {id:'t1', name:'Thread the Needle', area:'Thoracic', equipment:'none', duration:80, unilateral:true, cue:'Hips stacked, slide the arm underneath, rotate from the ribs and exhale into the reach. Switch sides halfway through.'},
  {id:'t2', name:'Open Book', area:'Thoracic', equipment:'none', duration:80, unilateral:true, cue:'Knees stacked, open the top arm like a book, let the eyes trail the hand. Switch sides halfway through.'},
  {id:'t3', name:'Foam Roller Extension', area:'Thoracic', equipment:'foam roller', duration:80, unilateral:false, cue:'Roller across the shoulder blades, hands behind the head, extend over the roller on an exhale.'},
  {id:'t4', name:'Cat-Cow Rotation', area:'Thoracic', equipment:'none', duration:80, unilateral:true, cue:'From all fours, thread one arm under and rotate up toward the ceiling, following with your gaze. Switch sides halfway through.'},
  {id:'t5', name:'Peanut Ball Extension', area:'Thoracic', equipment:'peanut ball', duration:80, unilateral:false, cue:'Peanut ball along the spine at bra-line, arms overhead, let gravity open the chest.'},
  {id:'t6', name:'Quadruped Reach', area:'Thoracic', equipment:'none', duration:80, unilateral:true, cue:'All fours, sweep one arm forward and up in an arc, rotating through the upper back. Switch sides halfway through.'},
  {id:'t7', name:'Yoga Wheel Extension', area:'Thoracic', equipment:'yoga wheel', duration:80, unilateral:false, cue:'Sit against the wheel at bra-line, walk it down as you extend back over it, arms overhead.'},
];
const OTHER = [
  {id:'o1', name:'90/90 Hip Switch', area:'Hips', equipment:'none', duration:75, unilateral:false, cue:'Seated, rotate both knees from one side to the other, keeping the spine tall.'},
  {id:'o2', name:'Couch Stretch', area:'Hips', equipment:'none', duration:80, unilateral:true, cue:'Rear foot up behind you, front knee forward, squeeze the glute and sink the hip forward. Switch legs halfway through.'},
  {id:'o3', name:'Frog Stretch', area:'Hips', equipment:'none', duration:75, unilateral:false, cue:'Knees wide, feet flexed, sink the hips back toward the heels.'},
  {id:'o4', name:'Standing Forward Fold', area:'Hamstrings', equipment:'none', duration:75, unilateral:false, cue:'Soft knees, hinge from the hips, let the head hang heavy.'},
  {id:'o5', name:'Band Hamstring Stretch', area:'Hamstrings', equipment:'band', duration:80, unilateral:true, cue:'Band around the foot, leg extended, draw the toes back and lengthen the back of the leg. Switch legs halfway through.'},
  {id:'o6', name:'Band Pull-Apart', area:'Shoulders', equipment:'band', duration:70, unilateral:false, cue:'Arms extended, pull the band apart squeezing the shoulder blades together.'},
  {id:'o7', name:'Lacrosse Ball Pec Release', area:'Shoulders', equipment:'lacrosse ball', duration:75, unilateral:true, cue:'Ball against the wall on the chest muscle, lean in until you find a tender spot, breathe. Switch sides halfway through.'},
  {id:'o8', name:'Doorway Pec Stretch', area:'Shoulders', equipment:'none', duration:70, unilateral:true, cue:'Forearm on the frame, step through gently until you feel a stretch across the chest. Switch arms halfway through.'},
  {id:'o9', name:'Lacrosse Ball Glute Release', area:'Glutes', equipment:'lacrosse ball', duration:80, unilateral:true, cue:'Seated on the ball, find a tender spot in the glute, breathe and let it soften. Switch sides halfway through.'},
  {id:'o10', name:'Figure-4 Stretch', area:'Glutes', equipment:'none', duration:75, unilateral:true, cue:'Ankle crossed over the opposite knee, hinge forward keeping the spine long. Switch legs halfway through.'},
  {id:'o11', name:'Foam Roller Calf Release', area:'Calves', equipment:'foam roller', duration:75, unilateral:true, cue:'Roller under the calf, roll slowly from ankle to knee, pausing on tight spots. Switch legs halfway through.'},
  {id:'o12', name:'Ankle Circles', area:'Calves', equipment:'none', duration:60, unilateral:true, cue:'Lift one foot, circle the ankle slowly in both directions. Switch feet halfway through.'},
  {id:'o13', name:'Neck Rotation', area:'Neck', equipment:'none', duration:65, unilateral:false, cue:'Slowly turn the head side to side, staying within a comfortable range.'},
  {id:'o14', name:'Bird Dog', area:'Core', equipment:'none', duration:75, unilateral:true, cue:'All fours, extend opposite arm and leg, keep the hips level and the core braced. Switch sides halfway through.'},
  {id:'o15', name:'Standing Side Bend', area:'Lats', equipment:'none', duration:65, unilateral:true, cue:'Reach one arm overhead and lean sideways, feeling the stretch along the ribs. Switch sides halfway through.'},
  {id:'o16', name:'Band Overhead Lat Stretch', area:'Lats', equipment:'band', duration:65, unilateral:true, cue:'Band overhead, hands wide, gently lean to one side to lengthen the lat. Switch sides halfway through.'},
  {id:'o17', name:'Foam Roller Quad Release', area:'Quads', equipment:'foam roller', duration:75, unilateral:true, cue:'Roller under the front of the thigh, forearms supporting your weight, roll slowly from hip to knee. Switch legs halfway through.'},
  {id:'o18', name:'Foam Roller IT Band Release', area:'IT Band', equipment:'foam roller', duration:70, unilateral:true, cue:'Roller along the outside of the thigh, stacked or kickstand leg for support, roll slowly from hip to knee. Switch sides halfway through.'},
  {id:'o19', name:'Foam Roller Upper Back Release', area:'Upper Back', equipment:'foam roller', duration:75, unilateral:false, cue:'Roller under the shoulder blades, knees bent, hug your arms across your chest and roll slowly from mid-back to shoulders.'},
  {id:'o20', name:'Foam Roller Glute Release', area:'Glutes', equipment:'foam roller', duration:75, unilateral:true, cue:'Seated on the roller, ankle crossed over the opposite knee, roll slowly and pause on tight spots. Switch sides halfway through.'},
  {id:'o21', name:'Lacrosse Ball Plantar Release', area:'Feet', equipment:'lacrosse ball', duration:60, unilateral:true, cue:'Stand with the ball under the arch of one foot, roll slowly from heel to toes with light pressure. Switch feet halfway through.'},
];
const ALL_EXERCISES = TSPINE.concat(OTHER);
const EQUIPMENT_LIST = ['foam roller', 'peanut ball', 'lacrosse ball', 'band', 'yoga wheel'];
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* ═══════════════════════ Helpers — unchanged logic from the design ═══════════════════════ */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayNumber(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000); }
function startOfWeek(d){ const nd=new Date(d); const day=nd.getDay(); const diff=(day===0?-6:1-day); nd.setDate(nd.getDate()+diff); nd.setHours(0,0,0,0); return nd; }
function addDays(base, n){ const nd = new Date(base); nd.setDate(nd.getDate() + n); return nd; }
function mod(n,m){ return ((n%m)+m)%m; }
function totalDuration(routine){ return routine.reduce((s,e)=>s+e.duration,0); }
function filteredPools(selectedEquipment, excludedExercises){
  const excludedSet = new Set(excludedExercises || []);
  const allowed = e => (e.equipment === 'none' || selectedEquipment.includes(e.equipment)) && !excludedSet.has(e.id);
  return { t: TSPINE.filter(allowed), o: OTHER.filter(allowed) };
}
function buildRoutine(oSel, tSel){
  const total = oSel.length + tSel.length;
  const gap = total / (tSel.length + 1);
  const tPositions = new Set(tSel.map((_, i) => Math.min(total - 1, Math.round(gap * (i + 1)) - 1)));
  const result = []; let oi = 0, ti = 0;
  for (let pos = 0; pos < total; pos++) {
    if (tPositions.has(pos) && ti < tSel.length) result.push(tSel[ti++]);
    else result.push(oSel[oi++] || tSel[ti++]);
  }
  return result;
}
function routineForDate(d, sessionLength, selectedEquipment, excludedExercises){
  const pools = filteredPools(selectedEquipment, excludedExercises);
  let tCount = sessionLength === 'quick' ? 1 : sessionLength === 'extended' ? 3 : 2;
  let oCount = sessionLength === 'quick' ? 3 : sessionLength === 'extended' ? 9 : 6;
  if (pools.t.length === 0) tCount = 0;
  if (pools.o.length === 0) oCount = 0;
  const dn = dayNumber(d);
  const tSel = [];
  if (pools.t.length) { const tStart = mod(dn * 2, pools.t.length); for (let i = 0; i < tCount; i++) tSel.push(pools.t[(tStart + i) % pools.t.length]); }
  const oSel = [];
  if (pools.o.length) { const oStart = mod(dn * 3, pools.o.length); for (let i = 0; i < oCount; i++) oSel.push(pools.o[(oStart + i) % pools.o.length]); }
  return buildRoutine(oSel, tSel);
}
function loadJSON(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const KEYS = {
  completions: 'tenmin_completions',
  totalSeconds: 'tenmin_totalSeconds',
  equipment: 'tenmin_equipment',
  sessionLength: 'tenmin_sessionLength',
  playerStyle: 'tenmin_playerStyle',
  excludedExercises: 'tenmin_excludedExercises',
  soundEnabled: 'tenmin_soundEnabled',
};

function groupByArea(list){
  const order = []; const map = {};
  list.forEach(e => { if (!map[e.area]) { map[e.area] = []; order.push(e.area); } map[e.area].push(e); });
  return order.map(area => ({ area, items: map[area] }));
}

/* ═══════════════════════ App state ═══════════════════════ */
let state = {
  tab: 'today',
  playerOpen: false,
  playerPhase: 'session',
  currentIndex: 0,
  secondsLeft: 0,
  paused: false,
  selectedOffset: 0,
  sessionOffset: 0,
  detailId: null,
  completions: loadJSON(KEYS.completions, []),
  totalSeconds: loadJSON(KEYS.totalSeconds, 0),
  selectedEquipment: loadJSON(KEYS.equipment, EQUIPMENT_LIST.slice()),
  sessionLength: loadJSON(KEYS.sessionLength, 'standard'),
  playerStyle: loadJSON(KEYS.playerStyle, 'guided'),
  excludedExercises: loadJSON(KEYS.excludedExercises, []),
  soundEnabled: loadJSON(KEYS.soundEnabled, true),
};

function routineFor(date){ return routineForDate(date, state.sessionLength, state.selectedEquipment, state.excludedExercises); }

function setState(patch){
  Object.assign(state, typeof patch === 'function' ? patch(state) : patch);
  render();
}

/* — actions — */
function tick(){
  const routine = routineFor(addDays(new Date(), state.sessionOffset));
  const current = routine[state.currentIndex];
  const left = state.secondsLeft - 1;
  if (current && current.unilateral) {
    const switchAt = Math.floor(current.duration / 2);
    if (left === switchAt + 3) playBeep(700);
    else if (left === switchAt + 2) playBeep(800);
    else if (left === switchAt + 1) playBeep(900);
    else if (left === switchAt) speak('Switch');
  }
  // Heads-up countdown before moving on to the next exercise (or finishing the session).
  if (left === 3) playBeep(700);
  else if (left === 2) playBeep(800);
  else if (left === 1) playBeep(900);
  if (left > 0) { setState({ secondsLeft: left }); return; }
  advance(routine);
}
function advance(routine){
  if (state.currentIndex + 1 < routine.length) {
    // Manual start: land on the next exercise paused, so there's time to get set up before it counts down.
    setState({ currentIndex: state.currentIndex + 1, secondsLeft: routine[state.currentIndex + 1].duration, paused: true });
  } else {
    completeSession(routine);
    setState({ playerPhase: 'complete' });
  }
}
function completeSession(routine){
  const key = dateKey(addDays(new Date(), state.sessionOffset));
  const completions = state.completions.includes(key) ? state.completions : [...state.completions, key];
  const totalSeconds = state.totalSeconds + totalDuration(routine);
  saveJSON(KEYS.completions, completions);
  saveJSON(KEYS.totalSeconds, totalSeconds);
  Object.assign(state, { completions, totalSeconds });
}
function openPlayer(){
  const offset = state.selectedOffset;
  const routine = routineFor(addDays(new Date(), offset));
  if (!routine.length) return;
  setState({ playerOpen: true, playerPhase: 'session', currentIndex: 0, secondsLeft: routine[0].duration, paused: true, sessionOffset: offset });
}
function closePlayer(){ setState({ playerOpen: false }); }
function togglePause(){
  if (state.paused) ensureAudioCtx(); // unlock audio on the user gesture that starts the timer
  setState({ paused: !state.paused });
}
function prevExercise(){
  if (state.currentIndex <= 0) return;
  const routine = routineFor(addDays(new Date(), state.sessionOffset));
  setState({ currentIndex: state.currentIndex - 1, secondsLeft: routine[state.currentIndex - 1].duration, paused: true });
}
function nextExercise(){ advance(routineFor(addDays(new Date(), state.sessionOffset))); }
function setTab(tab){ scrollMemory.main = 0; setState({ tab }); }
function selectDay(offset){ setState({ selectedOffset: offset }); }
function openDetail(id){ setState({ detailId: id }); }
function closeDetail(){ setState({ detailId: null }); }
function toggleEquipment(item){
  const has = state.selectedEquipment.includes(item);
  const next = has ? state.selectedEquipment.filter(x => x !== item) : [...state.selectedEquipment, item];
  saveJSON(KEYS.equipment, next);
  setState({ selectedEquipment: next });
}
function setSessionLength(v){ saveJSON(KEYS.sessionLength, v); setState({ sessionLength: v }); }
function setPlayerStyle(v){ saveJSON(KEYS.playerStyle, v); setState({ playerStyle: v }); }
function toggleExercise(id){
  const has = state.excludedExercises.includes(id);
  const next = has ? state.excludedExercises.filter(x => x !== id) : [...state.excludedExercises, id];
  saveJSON(KEYS.excludedExercises, next);
  setState({ excludedExercises: next });
}
function resetExercises(){
  saveJSON(KEYS.excludedExercises, []);
  setState({ excludedExercises: [] });
}
function setSoundEnabled(v){
  const on = v === 'on';
  saveJSON(KEYS.soundEnabled, on);
  if (on) ensureAudioCtx();
  setState({ soundEnabled: on });
}

/* — timer loop — */
setInterval(() => {
  const guided = state.playerStyle !== 'selfpaced';
  if (state.playerOpen && state.playerPhase === 'session' && !state.paused && guided) tick();
}, 1000);

/* — sound: countdown beeps + a spoken "Switch" cue, no audio files needed — */
let audioCtx = null;
function ensureAudioCtx(){
  if (!state.soundEnabled) return null;
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playBeep(freq){
  if (!state.soundEnabled) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq || 880;
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.2);
}
function speak(text){
  if (!state.soundEnabled) return;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ═══════════════════════ Render ═══════════════════════ */
const scrollMemory = {};

function renderTopBarPlayer(idx, total){
  return `
  <div class="topbar" style="padding-bottom:2px;">
    <button class="icon-btn" data-act="closePlayer">${ICONS.close}</button>
    <div style="font:700 13px var(--font-body);color:var(--color-neutral-600);">${idx + 1} / ${total}</div>
    <div style="width:38px;"></div>
  </div>`;
}

function renderSessionPhase(){
  const routine = routineFor(addDays(new Date(), state.sessionOffset));
  const idx = state.currentIndex;
  const current = routine[idx] || routine[0];
  const secondsLeft = state.secondsLeft;
  const r = 80, circumference = Math.round(2 * Math.PI * r * 100) / 100;
  const frac = current ? Math.max(0, Math.min(1, secondsLeft / current.duration)) : 0;
  const ringOffset = Math.round(circumference * (1 - frac) * 100) / 100;
  const isGuided = state.playerStyle !== 'selfpaced';
  const isUnilateral = !!(current && current.unilateral);
  const halfPoint = current ? current.duration / 2 : 0;
  const onSecondSide = isUnilateral && secondsLeft <= halfPoint;
  const sideLabel = !isUnilateral ? '' : (onSecondSide ? 'Second side — switch now' : 'First side');
  const canGoPrev = idx > 0;

  const dots = routine.map((e, i) => {
    if (i < idx) return `<div style="width:6px;height:6px;border-radius:50%;background:var(--color-accent-300);"></div>`;
    if (i === idx) return `<div style="width:8px;height:8px;border-radius:50%;background:var(--color-accent-600);"></div>`;
    return `<div style="width:6px;height:6px;border-radius:50%;background:var(--color-neutral-200);"></div>`;
  }).join('');

  return `
  ${renderTopBarPlayer(idx, routine.length)}
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 28px 0;overflow:auto;">
    <div style="display:flex;gap:6px;margin-bottom:14px;">
      <span class="tag tag-accent-2">${esc(current.area)}</span>
      ${current.equipment !== 'none' ? `<span class="tag tag-outline">${esc(current.equipment)}</span>` : ''}
      ${isUnilateral ? `<span class="tag tag-accent">${esc(sideLabel)}</span>` : ''}
    </div>
    <h2 style="font-size:25px;text-align:center;margin:0 0 20px;line-height:1.15;">${esc(current.name)}</h2>
    <div style="position:relative;width:180px;height:180px;flex-shrink:0;">
      <svg width="180" height="180" viewBox="0 0 190 190" style="transform:rotate(-90deg);position:absolute;top:-5px;left:-5px;">
        <circle cx="95" cy="95" r="80" fill="none" stroke="var(--color-neutral-100)" stroke-width="12"></circle>
        <circle class="ring-arc" cx="95" cy="95" r="80" fill="none" stroke="var(--color-accent-600)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${ringOffset}"></circle>
      </svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:42px;color:var(--color-text);">${secondsLeft}</div>
    </div>
    <p style="font:500 14px/1.5 var(--font-body);color:var(--color-neutral-700);text-align:center;margin-top:18px;max-width:270px;">${esc(current.cue)}</p>
  </div>
  <div style="flex:none;padding:6px 20px 6px;">
    <div style="display:flex;justify-content:center;gap:6px;margin-bottom:16px;align-items:center;">${dots}</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:24px;padding-bottom:12px;">
      ${canGoPrev
        ? `<button class="icon-btn" style="width:48px;height:48px;" data-act="prevExercise">${ICONS.chevLeft}</button>`
        : `<div style="width:48px;height:48px;"></div>`}
      ${isGuided
        ? `<button style="width:66px;height:66px;border-radius:50%;background:var(--color-accent-600);border:none;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);cursor:pointer;touch-action:manipulation;" data-act="togglePause">${state.paused ? ICONS.play : ICONS.pause}</button>`
        : `<div style="width:66px;height:66px;border-radius:50%;background:var(--color-neutral-100);display:flex;align-items:center;justify-content:center;text-align:center;font:700 10px/1.2 var(--font-body);color:var(--color-neutral-600);padding:6px;">Tap Next when ready</div>`}
      <button class="icon-btn" style="width:48px;height:48px;" data-act="nextExercise">${ICONS.chevRight}</button>
    </div>
  </div>`;
}

function renderCompletePhase(){
  const routine = routineFor(addDays(new Date(), state.sessionOffset));
  const completionsSet = new Set(state.completions);
  const streak = computeStreak(completionsSet);
  return `
  ${renderTopBarPlayer(state.currentIndex, routine.length)}
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;text-align:center;">
    <div style="width:72px;height:72px;border-radius:50%;background:var(--color-accent-2-500);display:flex;align-items:center;justify-content:center;margin-bottom:20px;">${ICONS.checkBig}</div>
    <h2 style="font-size:25px;margin:0 0 6px;">Session complete</h2>
    <p style="font:500 14px var(--font-body);color:var(--color-neutral-700);margin:0 0 26px;">${Math.round(totalDuration(routine)/60)} min · ${routine.length} moves · ${streak}${streak===1?' day':' days'} streak</p>
    <button class="btn btn-primary" style="width:100%;height:50px;" data-act="doneClose">Done</button>
  </div>`;
}

function computeStreak(completionsSet){
  const now = new Date();
  let streak = 0; const cursor = new Date(now);
  if (!completionsSet.has(dateKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  while (completionsSet.has(dateKey(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }
  return streak;
}

function renderTodayTab(){
  const now = new Date();
  const todayKey = dateKey(now);
  const hour = now.getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const completionsSet = new Set(state.completions);
  const streak = computeStreak(completionsSet);

  const selDate = addDays(now, state.selectedOffset);
  const selRoutine = routineFor(selDate);
  const totalMin = Math.round(totalDuration(selRoutine) / 60);
  const selIsToday = state.selectedOffset === 0;
  const selIsDone = completionsSet.has(dateKey(selDate));
  const selDayFull = DAY_FULL[(selDate.getDay() + 6) % 7];
  const selHeading = selIsToday ? 'Today' : selDayFull;
  const selKicker = selIsToday ? "Today's routine" : selDayFull + "'s routine";
  const selTopLine = selIsToday ? greeting : selDayFull + ' · ' + (selDate.getMonth() + 1) + '/' + selDate.getDate();

  const areaSet = [];
  selRoutine.forEach(e => { if (!areaSet.includes(e.area)) areaSet.push(e.area); });

  let dayStripHtml = '';
  for (let off = -5; off <= 7; off++) {
    const d = addDays(now, off);
    const key = dateKey(d);
    const isSelected = off === state.selectedOffset;
    const isDone = completionsSet.has(key);
    const bg = isSelected ? 'var(--color-accent-600)' : 'var(--color-neutral-100)';
    const color = isSelected ? '#fff' : 'var(--color-neutral-800)';
    const labelColor = isSelected ? 'rgba(255,255,255,0.85)' : 'var(--color-neutral-600)';
    const doneMark = isDone
      ? (isSelected ? ICONS.check('#fff', 10) : ICONS.check('var(--color-accent-2-600)', 11))
      : `<div style="width:5px;height:5px;border-radius:50%;background:${isSelected ? '#fff' : 'var(--color-neutral-300)'};"></div>`;
    dayStripHtml += `
      <button class="day-tile" data-act="selectDay" data-arg="${off}" data-day-offset="${off}" style="background:${bg};color:${color};">
        <div style="font:700 10px var(--font-body);letter-spacing:0.04em;color:${labelColor};">${DAY_NAMES[(d.getDay()+6)%7]}</div>
        <div style="font:800 18px var(--font-body);">${d.getDate()}</div>
        ${doneMark}
      </button>`;
  }

  const areaChips = areaSet.map(a => `<span class="tag tag-accent-2">${esc(a)}</span>`).join('');
  const sessionRows = selRoutine.map((e, i) => `
    <div class="card session-row" style="flex-direction:row;align-items:center;gap:12px;" data-act="openDetail" data-arg="${esc(e.id)}">
      <div style="width:28px;height:28px;border-radius:50%;background:var(--color-neutral-100);color:var(--color-neutral-700);display:flex;align-items:center;justify-content:center;font:700 12px var(--font-body);flex-shrink:0;">${i+1}</div>
      <div style="flex:1;min-width:0;">
        <div style="font:600 14px var(--font-body);color:var(--color-text);">${esc(e.name)}</div>
        <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;">
          <span class="tag tag-accent-2">${esc(e.area)}</span>
          ${e.equipment !== 'none' ? `<span class="tag tag-outline">${esc(e.equipment)}</span>` : ''}
        </div>
      </div>
      <div style="font:600 13px var(--font-body);color:var(--color-neutral-600);flex-shrink:0;">${e.unilateral ? e.duration + 's · ' + Math.round(e.duration/2) + 's/side' : e.duration + 's'}</div>
    </div>`).join('');

  return `
  <div class="day-strip" data-preserve-scroll="day-strip">${dayStripHtml}</div>
  <div style="padding:2px 20px 0;">
    <div style="font:700 12px var(--font-body);color:var(--color-accent-700);text-transform:uppercase;letter-spacing:0.08em;">${esc(selTopLine)}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px;">
      <h1 style="font-size:32px;margin:0;">${esc(selHeading)}</h1>
      ${streak > 0 ? `<div style="display:flex;align-items:center;gap:5px;background:var(--color-accent-100);color:var(--color-accent-800);padding:7px 13px;border-radius:999px;font:700 13px var(--font-body);">${ICONS.flame}${streak}${streak===1?' day':' days'}</div>` : ''}
    </div>
  </div>
  <div style="margin:14px 20px 0;background:var(--color-accent-100);border-radius:32px;padding:22px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="font:700 11px var(--font-body);letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-700);">${esc(selKicker)}</div>
      ${selIsDone ? `<span class="tag tag-accent-2">Completed</span>` : ''}
    </div>
    <div style="font-family:var(--font-heading);font-size:23px;margin-top:5px;color:var(--color-text);line-height:1.15;">Thoracic reset + full body</div>
    ${selRoutine.length
      ? `<div style="font:500 14px var(--font-body);color:var(--color-accent-800);opacity:0.85;margin-top:3px;">${totalMin} min · ${selRoutine.length} moves</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;">${areaChips}</div>
    <button class="btn btn-primary" style="width:100%;margin-top:16px;height:50px;font-size:15px;" data-act="openPlayer">Start Session</button>`
      : `<div style="font:500 14px var(--font-body);color:var(--color-accent-800);opacity:0.85;margin-top:3px;">No exercises available with the current settings.</div>
    <button class="btn btn-secondary" style="width:100%;margin-top:16px;height:50px;font-size:15px;" data-act="setTab" data-arg="exercises">Review Exercises</button>`}
  </div>
  <div style="padding:22px 20px 20px;">
    <h3 style="font-size:14px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-neutral-700);margin:0 0 10px;">In this session</h3>
    <div style="display:flex;flex-direction:column;gap:8px;">${sessionRows || `<p style="font:500 14px var(--font-body);color:var(--color-neutral-700);margin:0;">Turn some exercises back on in the Exercises tab, or check more equipment.</p>`}</div>
  </div>`;
}

function renderExercisesTab(){
  const excludedSet = new Set(state.excludedExercises);
  const groups = groupByArea(ALL_EXERCISES);
  const sections = groups.map(({ area, items }) => {
    const includedCount = items.filter(e => !excludedSet.has(e.id)).length;
    const rows = items.map(e => {
      const checked = !excludedSet.has(e.id);
      const boxStyle = checked ? 'background:var(--color-accent-600);border:none;' : 'background:none;border:2px solid var(--color-neutral-300);';
      return `
      <div class="card session-row" style="flex-direction:row;align-items:center;gap:12px;padding:12px 14px;" data-act="openDetail" data-arg="${esc(e.id)}">
        <button type="button" data-act="toggleExercise" data-arg="${esc(e.id)}" style="padding:0;margin:0;cursor:pointer;touch-action:manipulation;width:26px;height:26px;border-radius:8px;flex-shrink:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;${boxStyle}">${checked ? ICONS.check('#fff', 13) : ''}</button>
        <div style="flex:1;min-width:0;">
          <div style="font:600 14px var(--font-body);color:var(--color-text);${checked ? '' : 'opacity:0.5;'}">${esc(e.name)}</div>
          ${e.equipment !== 'none' ? `<div style="margin-top:4px;"><span class="tag tag-outline">${esc(e.equipment)}</span></div>` : ''}
        </div>
        <div style="font:600 13px var(--font-body);color:var(--color-neutral-600);flex-shrink:0;">${e.unilateral ? e.duration + 's · ' + Math.round(e.duration/2) + 's/side' : e.duration + 's'}</div>
      </div>`;
    }).join('');
    return `
    <div style="padding:0 20px 18px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px;">
        <h3 style="font-size:14px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-neutral-700);margin:0;">${esc(area)}</h3>
        <div style="font:600 12px var(--font-body);color:var(--color-neutral-500);">${includedCount} of ${items.length}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">${rows}</div>
    </div>`;
  }).join('');

  return `
  <div style="padding:6px 20px 0;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
      <div>
        <h1 style="font-size:32px;margin:0;">Exercises</h1>
        <div style="font:500 14px var(--font-body);color:var(--color-neutral-700);margin-top:2px;">Turn off any move you'd rather skip — routines pull only from what's on.</div>
      </div>
      <button class="btn btn-secondary" style="flex-shrink:0;white-space:nowrap;" data-act="resetExercises">Include all</button>
    </div>
  </div>
  <div style="padding:16px 0 8px;">${sections}</div>`;
}

function renderEquipmentTab(){
  const rows = EQUIPMENT_LIST.map(item => {
    const checked = state.selectedEquipment.includes(item);
    const label = item.charAt(0).toUpperCase() + item.slice(1);
    const count = ALL_EXERCISES.filter(e => e.equipment === item).length;
    return `
    <div class="card equipment-row" style="flex-direction:row;align-items:center;gap:14px;padding:14px 16px;" data-act="toggleEquipment" data-arg="${esc(item)}">
      ${checked
        ? `<div style="width:28px;height:28px;border-radius:8px;background:var(--color-accent-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;">${ICONS.check('#fff', 15)}</div>`
        : `<div style="width:28px;height:28px;border-radius:8px;border:2px solid var(--color-neutral-300);flex-shrink:0;box-sizing:border-box;"></div>`}
      <div style="flex:1;min-width:0;">
        <div style="font:600 15px var(--font-body);color:var(--color-text);">${label}</div>
        <div style="font:500 13px var(--font-body);color:var(--color-neutral-600);margin-top:2px;">${count} exercises</div>
      </div>
    </div>`;
  }).join('');

  const segLength = ['quick','standard','extended'].map(v => `
    <label class="seg-opt ${state.sessionLength===v?'is-checked':''}" data-act="setSessionLength" data-arg="${v}">${v.charAt(0).toUpperCase()+v.slice(1)}</label>`).join('');
  const segStyle = [['guided','Guided'],['selfpaced','Self-paced']].map(([v,label]) => `
    <label class="seg-opt ${state.playerStyle===v?'is-checked':''}" data-act="setPlayerStyle" data-arg="${v}">${label}</label>`).join('');
  const segSound = [['on','Sound on'],['off','Sound off']].map(([v,label]) => `
    <label class="seg-opt ${(state.soundEnabled?'on':'off')===v?'is-checked':''}" data-act="setSoundEnabled" data-arg="${v}">${label}</label>`).join('');

  return `
  <div style="padding:6px 20px 0;">
    <h1 style="font-size:32px;margin:0;">Equipment</h1>
    <div style="font:500 14px var(--font-body);color:var(--color-neutral-700);margin-top:2px;">Pick what you have — routines pull only from these.</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;padding:16px 20px 12px;">${rows}</div>
  <div style="padding:0 20px 22px;">
    <p style="font:500 13px/1.5 var(--font-body);color:var(--color-neutral-700);margin:0;">Bodyweight-only moves are always included, so routines never run dry — uncheck everything for a no-equipment week.</p>
  </div>
  <div style="padding:4px 20px 28px;display:flex;flex-direction:column;gap:18px;">
    <div class="hr" style="height:1px;background:var(--color-divider);"></div>
    <div>
      <h3 style="font-size:14px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-neutral-700);margin:0 0 10px;">Session length</h3>
      <div class="seg">${segLength}</div>
    </div>
    <div>
      <h3 style="font-size:14px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-neutral-700);margin:0 0 10px;">Session player</h3>
      <div class="seg">${segStyle}</div>
    </div>
    <div>
      <h3 style="font-size:14px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-neutral-700);margin:0 0 10px;">Switch-side cues</h3>
      <div class="seg">${segSound}</div>
      <p style="font:500 13px/1.5 var(--font-body);color:var(--color-neutral-700);margin:10px 0 0;">A 3-second countdown before each exercise ends, plus a spoken "Switch" on exercises that change sides halfway through. Guided sessions only.</p>
    </div>
  </div>`;
}

function renderProgressTab(){
  const completionsSet = new Set(state.completions);
  const streak = computeStreak(completionsSet);
  const now = new Date();
  const todayKey = dateKey(now);
  const monday = startOfWeek(now);
  const weekDots = DAY_NAMES.map((label, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const key = dateKey(d);
    const isToday = key === todayKey;
    const isDone = completionsSet.has(key);
    let circle;
    if (isDone) circle = `<div style="width:28px;height:28px;border-radius:50%;background:var(--color-accent-2-500);"></div>`;
    else if (isToday) circle = `<div style="width:28px;height:28px;border-radius:50%;border:2px solid var(--color-accent-600);box-sizing:border-box;"></div>`;
    else circle = `<div style="width:28px;height:28px;border-radius:50%;border:2px solid var(--color-neutral-200);box-sizing:border-box;"></div>`;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font:600 11px var(--font-body);color:var(--color-neutral-600);">${label[0]}</div>${circle}
    </div>`;
  }).join('');

  const sessions = state.completions.length;
  const totalMinutesAll = Math.round(state.totalSeconds / 60);

  return `
  <div style="padding:6px 20px 0;"><h1 style="font-size:32px;margin:0;">Progress</h1></div>
  <div style="margin:14px 20px 0;background:var(--color-accent-100);border-radius:32px;padding:20px 22px;display:flex;align-items:center;gap:16px;">
    <div style="width:52px;height:52px;border-radius:50%;background:var(--color-accent-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;">${ICONS.flameBig}</div>
    <div>
      <div style="font-family:var(--font-heading);font-size:26px;color:var(--color-text);">${streak}${streak===1?' day':' days'}</div>
      <div style="font:500 13px var(--font-body);color:var(--color-accent-800);opacity:0.8;">current streak</div>
    </div>
  </div>
  <div style="padding:22px 20px 6px;">
    <div style="font:700 12px var(--font-body);text-transform:uppercase;letter-spacing:0.07em;color:var(--color-neutral-700);margin-bottom:12px;">This week</div>
    <div style="display:flex;justify-content:space-between;">${weekDots}</div>
  </div>
  <div style="display:flex;gap:10px;padding:20px 20px 4px;">
    <div class="card" style="flex:1;align-items:center;text-align:center;">
      <div style="font-family:var(--font-heading);font-size:25px;">${sessions}</div>
      <div style="font:500 12px var(--font-body);color:var(--color-neutral-700);">sessions logged</div>
    </div>
    <div class="card" style="flex:1;align-items:center;text-align:center;">
      <div style="font-family:var(--font-heading);font-size:25px;">${totalMinutesAll}</div>
      <div style="font:500 12px var(--font-body);color:var(--color-neutral-700);">minutes moved</div>
    </div>
  </div>
  <div style="padding:14px 20px 26px;">
    <p style="font:500 14px/1.5 var(--font-body);color:var(--color-neutral-700);margin:0;">Consistency compounds. Ten minutes, most days, does more for a stiff back than an hour once a week.</p>
  </div>`;
}

function renderTabBar(){
  const tabs = [
    { id: 'today', label: 'Routine', icon: ICONS.routine },
    { id: 'exercises', label: 'Exercises', icon: ICONS.exercises },
    { id: 'equipment', label: 'Equipment', icon: ICONS.equipment },
    { id: 'progress', label: 'Progress', icon: ICONS.progress },
  ];
  return `<div class="tabbar">${tabs.map(t => `
    <button class="tab-btn ${state.tab===t.id?'is-active':''}" data-act="setTab" data-arg="${t.id}">${t.icon}${t.label}</button>`).join('')}</div>`;
}

function renderDetailDialog(){
  if (!state.detailId) return '';
  const ex = ALL_EXERCISES.find(e => e.id === state.detailId) || ALL_EXERCISES[0];
  const videoUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.name + ' stretch how to');
  return `
  <div class="dialog-backdrop" data-act="closeDetail">
    <div class="dialog">
      <div class="dialog-title">${esc(ex.name)}</div>
      <div style="display:flex;gap:6px;">
        <span class="tag tag-accent-2">${esc(ex.area)}</span>
        ${ex.equipment !== 'none' ? `<span class="tag tag-outline">${esc(ex.equipment)}</span>` : ''}
      </div>
      <div class="dialog-body">${esc(ex.cue)}</div>
      ${ex.unilateral ? `<div style="font:700 12px var(--font-body);color:var(--color-accent-700);margin-top:-4px;">${Math.round(ex.duration/2)}s per side — switch halfway through</div>` : ''}
      <a href="${videoUrl}" target="_blank" rel="noopener" class="btn btn-secondary" style="text-decoration:none;justify-content:flex-start;gap:8px;">${ICONS.youtube}Watch on YouTube</a>
      <div class="dialog-actions">
        <button class="btn btn-secondary" data-act="closeDetail">Close</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let body;

  if (state.playerOpen) {
    body = `<div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      ${state.playerPhase === 'session' ? renderSessionPhase() : renderCompletePhase()}
    </div>`;
  } else {
    let tabContent;
    if (state.tab === 'today') tabContent = renderTodayTab();
    else if (state.tab === 'exercises') tabContent = renderExercisesTab();
    else if (state.tab === 'equipment') tabContent = renderEquipmentTab();
    else tabContent = renderProgressTab();

    body = `
      <div style="flex:1;overflow:auto;" data-preserve-scroll="main">${tabContent}</div>
      ${renderTabBar()}`;
  }

  app.innerHTML = body + renderDetailDialog();

  // Restore/seed scroll positions that a full re-render would otherwise reset.
  app.querySelectorAll('[data-preserve-scroll]').forEach(el => {
    const id = el.dataset.preserveScroll;
    if (id in scrollMemory && scrollMemory[id] != null) {
      if (id === 'day-strip') el.scrollLeft = scrollMemory[id];
      else el.scrollTop = scrollMemory[id];
    } else if (id === 'day-strip') {
      const todayEl = el.querySelector('[data-day-offset="0"]');
      if (todayEl) el.scrollLeft = todayEl.offsetLeft - (el.clientWidth - todayEl.clientWidth) / 2;
    }
  });
}

/* — capture scroll positions right before the next re-render replaces the DOM — */
function captureScrollMemory(){
  document.querySelectorAll('[data-preserve-scroll]').forEach(el => {
    const id = el.dataset.preserveScroll;
    scrollMemory[id] = id === 'day-strip' ? el.scrollLeft : el.scrollTop;
  });
}
const _setState = setState;
setState = function(patch){ captureScrollMemory(); _setState(patch); };

/* ═══════════════════════ Event delegation ═══════════════════════ */
document.addEventListener('click', (e) => {
  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;
  const arg = actEl.dataset.arg;

  // Only suppress the backdrop's own close when the click bubbled up from blank
  // space inside the dialog card — not when the click is on the Close button itself
  // (which has its own data-act and is matched directly as actEl).
  if (act === 'closeDetail' && actEl.classList.contains('dialog-backdrop') && e.target !== actEl) return;

  switch (act) {
    case 'closePlayer': closePlayer(); break;
    case 'togglePause': togglePause(); break;
    case 'prevExercise': prevExercise(); break;
    case 'nextExercise': nextExercise(); break;
    case 'openPlayer': openPlayer(); break;
    case 'doneClose': captureScrollMemory(); closePlayer(); setTab('today'); break;
    case 'setTab': setTab(arg); break;
    case 'selectDay': selectDay(parseInt(arg, 10)); break;
    case 'openDetail': openDetail(arg); break;
    case 'closeDetail': closeDetail(); break;
    case 'toggleEquipment': toggleEquipment(arg); break;
    case 'setSessionLength': setSessionLength(arg); break;
    case 'setPlayerStyle': setPlayerStyle(arg); break;
    case 'toggleExercise': toggleExercise(arg); break;
    case 'resetExercises': resetExercises(); break;
    case 'setSoundEnabled': setSoundEnabled(arg); break;
  }
});

render();

/* ═══════════════════════ Service worker — offline support once hosted over http(s) ═══════════════════════ */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
